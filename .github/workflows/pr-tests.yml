name: Play Along Pull Request Tests

on:
  pull_request:
  push:
    branches:
      - fix/practice-seek-backup-abort-v0.10.26

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Require README.md changes in every pull request
        if: github.event_name == 'pull_request'
        run: |
          if ! git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD | grep -Fxq 'README.md'; then
            echo "::error::Every Play Along pull request must update README.md with release notes, user impact and validation."
            exit 1
          fi
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm test
      - name: FG-02C educational reference benchmark
        run: |
          mkdir -p artifacts
          FG02C_REPORT=artifacts/fg02c-reference-benchmark.json npm run benchmark:fingering
      - name: FG-02D phrase benchmark (research only)
        run: FG02D_REPORT=artifacts/fg02d-phrase-comparison.json npm run benchmark:fingering:phrases
      - name: FG-02E held-out key benchmark (no algorithm changes)
        run: FG02E_REPORT=artifacts/fg02e-heldout.json npm run benchmark:fingering:heldout
      - name: FG-02F retrospective generalized fingering diagnostic
        run: FG02F_REPORT=artifacts/fg02f-generalized-diagnostic.json npm run benchmark:fingering:generalized
      - name: FG-02G real repertoire fingering audit (pinned CC-BY-SA sources)
        run: FG02G_REPORT=artifacts/fg02g-real-repertoire.json npm run benchmark:fingering:repertoire
      - name: FG-02H mixed phrasing and author anchor acceptance
        run: FG02H_REPORT=artifacts/fg02h-contextual-repertoire.json npm run benchmark:fingering:contextual
      - name: FG-02I two-hand score router retrospective research
        run: FG02I_REPORT=artifacts/fg02i-score-router.json npm run benchmark:fingering:score-router
      - name: FG-02J independently sourced polyphonic fingering eligibility discovery
        run: FG02J_DISCOVERY_REPORT=artifacts/fg02j-polyphony-source.json npm run research:fingering:polyphony-source
      - name: FG-02J pinned 11-recording GT to MIDI/TSV correspondence
        run: FG02J_ALIGNMENT_REPORT=artifacts/fg02j-gt-alignment.json npm run research:fingering:polyphony-align
      - name: FG-02J independent real polyphonic GT closed-island benchmark (noncommercial research only)
        run: FG02J_POLYPHONY_REPORT=artifacts/fg02j-real-polyphony.json npm run benchmark:fingering:independent-polyphony
      - name: FG-04B1a pinned MIT MusicXML technical corpus integrity
        run: FG04B1A_REPORT=artifacts/fg04b1a-technical-corpus.json npm run research:fingering:corpus:technical
      - name: FG-04B1b immutable ASAP real score pair integrity (NC research)
        run: FG04B1B_REPORT=artifacts/fg04b1b-asap-scores.json npm run research:fingering:corpus:asap
      - name: FG-04B3b real 16-piece MusicXML-to-MIDI score integrity and alignment research
        run: FG04B3B_REPORT=artifacts/fg04b3b-asap-xml-midi.json npm run research:fingering:asap:xml-midi
      - name: Browser regressions
        run: npm run test:browser
      - name: Upload FG-02C reference comparison
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: fg02c-educational-reference-comparison
          path: artifacts/fg02c-reference-benchmark.json
          if-no-files-found: warn
      - name: Upload FG-02D phrase comparison
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: fg02d-phrase-dev-comparison
          path: artifacts/fg02d-phrase-comparison.json
          if-no-files-found: warn
      - name: Upload frozen FG-02E held-out comparison
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: fg02e-frozen-heldout-34-cases
          path: artifacts/fg02e-heldout.json
          if-no-files-found: error
      - name: Upload FG-02F generalized diagnostic
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: fg02f-retrospective-generalized-diagnostic
          path: artifacts/fg02f-generalized-diagnostic.json
          if-no-files-found: error
      - name: Upload FG-02G real repertoire benchmark
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: fg02g-real-piece-reference-report
          path: artifacts/fg02g-real-repertoire.json
          if-no-files-found: error
      - name: Upload FG-02H contextual retrospective benchmark
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: fg02h-contextual-repertoire-report
          path: artifacts/fg02h-contextual-repertoire.json
          if-no-files-found: error
      - name: Upload FG-02I two-hand score router report
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: fg02i-score-router-research-report
          path: artifacts/fg02i-score-router.json
          if-no-files-found: error
      - name: Upload FG-02J source qualification and NO-GO evidence
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: fg02j-independent-polyphony-source-qualification
          path: artifacts/fg02j-polyphony-source.json
          if-no-files-found: error
      - name: Upload FG-02J independent GT alignment coverage and blockers
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: fg02j-pinned-11-recording-alignment
          path: artifacts/fg02j-gt-alignment.json
          if-no-files-found: error
      - name: Upload FG-02J independent real polyphonic fingering summary (no raw source notes)
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: fg02j-real-polyphony-closed-islands
          path: artifacts/fg02j-real-polyphony.json
          if-no-files-found: error
      - name: Upload FG-04B1a pinned MusicXML technical source verification
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: fg04b1a-mit-musicxml-technical-corpus
          path: artifacts/fg04b1a-technical-corpus.json
          if-no-files-found: error
      - name: Upload FG-04B1b real score-pair source verification
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: fg04b1b-asap-16-real-score-pairs-research
          path: artifacts/fg04b1b-asap-scores.json
          if-no-files-found: error
      - name: Upload FG-04B3b raw score-MIDI comparison (aggregate evidence only)
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: fg04b3b-asap-16-score-xml-midi-audit
          path: artifacts/fg04b3b-asap-xml-midi.json
          if-no-files-found: error
      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Upload visual PNG-hand review screenshots
        if: always() && github.event_name == 'pull_request' && (github.head_ref == 'feature/finger-guidance-png-hands' || github.head_ref == 'feature/finger-guidance-pose-assets-v0.10.29' || github.head_ref == 'feature/fg03b2-safe-hand-motion-v0.10.44')
        uses: actions/upload-artifact@v4
        with:
          name: finger-guidance-png-real-app
          path: artifacts/finger-png/*.png
          if-no-files-found: warn

      - name: Upload FG-03B2B 25/49/61/88-key screenshot QA matrix
        if: always() && github.event_name == 'pull_request' && github.head_ref == 'feature/fg03b2b-range-safety-v0.10.46'
        uses: actions/upload-artifact@v4
        with:
          name: fg03b2b-piano-range-visual-review
          path: artifacts/finger-range-review/
          if-no-files-found: error
