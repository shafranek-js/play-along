name: Play Along Pull Request Tests

on:
  pull_request:
  push:
    branches:
      - fix/practice-seek-backup-abort-v0.10.26

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm test
      - name: Browser regressions
        run: npm run test:browser
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Capture FG-00B screenshots from real app
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/finger-guidance-visual-fg00b'
        run: node tests/finger-guidance.visual.real.test.mjs
      - name: Upload FG-00B visual review snapshots
        if: always() && github.event_name == 'pull_request' && github.head_ref == 'feature/finger-guidance-visual-fg00b'
        uses: actions/upload-artifact@v4
        with:
          name: fg00b-real-app-visuals
          path: artifacts/fg00b/*.png
          if-no-files-found: error
