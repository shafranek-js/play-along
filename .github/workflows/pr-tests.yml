name: Play Along Pull Request Tests

on:
  pull_request:
  push:
    branches:
      - fix/practice-seek-backup-abort-v0.10.26

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm test
      - name: FG-02C educational reference benchmark
        run: |
          mkdir -p artifacts
          FG02C_REPORT=artifacts/fg02c-reference-benchmark.json npm run benchmark:fingering
      - name: Browser regressions
        run: npm run test:browser
      - name: Upload FG-02C reference comparison
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: fg02c-educational-reference-comparison
          path: artifacts/fg02c-reference-benchmark.json
          if-no-files-found: warn
      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Upload visual PNG-hand review screenshots
        if: always() && github.event_name == 'pull_request' && (github.head_ref == 'feature/finger-guidance-png-hands' || github.head_ref == 'feature/finger-guidance-pose-assets-v0.10.29')
        uses: actions/upload-artifact@v4
        with:
          name: finger-guidance-png-real-app
          path: artifacts/finger-png/*.png
          if-no-files-found: warn
