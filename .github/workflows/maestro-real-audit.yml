name: MAESTRO v3.0.0 MIDI and Diversity Research Audit

on:
  pull_request:
    paths:
      - 'scripts/maestro-midi-audit.mjs'
      - 'scripts/maestro-diversity.mjs'
      - 'tests/maestro-midi-audit.test.mjs'
      - 'tests/maestro-diversity.test.mjs'
      - 'package.json'
      - '.github/workflows/maestro-real-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-maestro:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Synthetic ZIP, MIDI and metadata tests
        run: npm run test:maestro
      - name: Download official MAESTRO v3.0.0 CSV and MIDI ZIP
        run: |
          mkdir -p "$RUNNER_TEMP/maestro" artifacts
          curl --fail --location --retry 3 --max-time 120 --silent --show-error \
            'https://storage.googleapis.com/magentadata/datasets/maestro/v3.0.0/maestro-v3.0.0.csv' \
            --output "$RUNNER_TEMP/maestro/maestro-v3.0.0.csv"
          curl --fail --location --retry 3 --max-time 360 --silent --show-error \
            'https://storage.googleapis.com/magentadata/datasets/maestro/v3.0.0/maestro-v3.0.0-midi.zip' \
            --output "$RUNNER_TEMP/maestro/maestro-v3.0.0-midi.zip"
      - name: Official archive SHA256 verification
        run: |
          echo '70470ee253295c8d2c71e6d9d4a815189e35c89624b76d22fce5a019d5dde12c  '"$RUNNER_TEMP/maestro/maestro-v3.0.0-midi.zip" | sha256sum --check --status
      - name: Audit 1276 archive paths and profile 24 real MIDI performances
        run: |
          npm run research:maestro:audit -- \
            --csv "$RUNNER_TEMP/maestro/maestro-v3.0.0.csv" \
            --zip "$RUNNER_TEMP/maestro/maestro-v3.0.0-midi.zip" \
            --out artifacts/maestro-v3-actual-audit.json
      - name: Profile all 1276 real MIDI performances and select balanced 24-work corpus
        run: |
          npm run research:maestro:diversity -- \
            --csv "$RUNNER_TEMP/maestro/maestro-v3.0.0.csv" \
            --zip "$RUNNER_TEMP/maestro/maestro-v3.0.0-midi.zip" \
            --out artifacts/maestro-v3-measured-diversity.json
      - name: Log 24 derived path/SHA256 pins for immutable QA corpus
        run: |
          node --input-type=module -e '
          import fs from "node:fs";
          const report=JSON.parse(fs.readFileSync("artifacts/maestro-v3-measured-diversity.json","utf8"));
          for (const item of report.works) {
            console.log("MAESTRO_PIN "+JSON.stringify({split:item.split,midi_filename:item.midi_filename,midi_sha256:item.midi_sha256}));
          }
          '
      - name: Upload measured-diversity corpus report (no source MIDI)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-v3-measured-diversity
          path: artifacts/maestro-v3-measured-diversity.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload derived metadata-only audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-v3-actual-midi-audit
          path: artifacts/maestro-v3-actual-audit.json
          if-no-files-found: warn
          retention-days: 14
