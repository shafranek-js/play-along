name: Test and deploy Play Along

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Capture deterministic lockfile snapshot
        run: |
          node -e "const fs=require('fs');const s=fs.readFileSync('package-lock.json','utf8');for(let i=0;i<s.length;i+=3000)console.log('LOCKCHUNK:'+i+':'+JSON.stringify(s.slice(i,i+3000)))"
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Real OpenSheetMusicDisplay browser tests
        run: npm run test:browser
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
