name: Test and deploy Play Along

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Real OpenSheetMusicDisplay browser tests
        run: npm run test:browser
      - name: Upload SoundFont acceptance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soundfont-acceptance
          path: |
            artifacts/audio-sf01/runs/*.json
            artifacts/audio-sf03/**/*.json
            artifacts/audio-sf04/**/*.json
            artifacts/audio-sf05/**/*.json
          if-no-files-found: warn
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
