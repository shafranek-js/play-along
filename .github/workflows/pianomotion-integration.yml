name: PianoMotion integration Chromium QA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pianomotion-browser-qa
  cancel-in-progress: true

jobs:
  verify-pianomotion:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build production assets
        run: npm run build
      - name: Run source MIDI/PianoMotion identity regressions
        run: node --test tests/pianomotion-source-selection.test.mjs tests/pianomotion-source-identity.test.mjs tests/pianomotion-review.test.mjs tests/pianomotion-physical-audit.test.mjs tests/pianomotion-browser-python.test.mjs
      - name: Real Chromium apply and MusicXML export
        run: node tests/pianomotion-apply-export.test.mjs
      - name: Real Chromium 547-note guitar + flute MIDI roundtrip
        run: node tests/pianomotion-musicxml-roundtrip.real.test.mjs
      - name: Real Chromium hard-conflict refusal
        run: node tests/pianomotion-physical-audit.real.test.mjs
